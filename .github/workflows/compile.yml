name: Build Mycelis Firmware

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build Natively Without EIM
        run: |
          echo "Cloning ESP-IDF v5.3..."
          git clone -b v5.3 --depth 1 --recursive https://github.com/espressif/esp-idf.git $HOME/esp-idf
          
          echo "Running native installer..."
          cd $HOME/esp-idf
          ./install.sh esp32s3
          
          echo "Exporting environment..."
          . ./export.sh
          
          echo "Building firmware with idf.py..."
          cd $GITHUB_WORKSPACE
          idf.py set-target esp32s3
          idf.py build

      - name: Save firmware
        uses: actions/upload-artifact@v4
        with:
          name: Mycelis-firmware
          path: |
            build/*.bin
